name: Run Unit Tests
on: push

jobs:
  tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        name: 🧾 Checkout
      - uses: chickensoft-games/setup-godot@v2
        name: 🤖 Setup Godot
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false
      - name: 🔬 Verify Setup
        run: |
          godot --version
      - name: 🧪 Test
        run: godot --headless -s addons/gut/gut_cmdln.gd -d --path "$PWD"
